name: Publish Docker image to Docker Hub

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.github/workflows/docker-publish.yml'
      - 'index.js'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # ---------- 1) build locally (amd64) so we can run it BEFORE publishing ----------
      - name: Build for smoke test (linux/amd64, load)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: local/proxy-ip-check:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------- 2) smoke test: usage / human output / JSON contract ----------
      - name: Smoke test
        run: |
          set -euo pipefail

          # NOTE: the image defines CMD ["8.8.8.8"], so a bare `docker run` performs a
          # default lookup instead of showing usage. Override the entrypoint to reach
          # the CLI's true no-argument behaviour.
          echo '=== no args => usage banner, CLI exits 1 ==='
          out=$(docker run --rm --entrypoint sh local/proxy-ip-check:smoke \
                -c 'proxy-ip-check; echo "___EXIT=$?"')
          printf '%s\n' "$out"
          grep -q 'Usage:' <<< "$out"      || { echo 'FAIL: usage banner missing'; exit 1; }
          grep -q '___EXIT=1' <<< "$out"   || { echo 'FAIL: expected CLI exit code 1 with no args'; exit 1; }
          echo 'usage check OK'

          echo '=== default CMD (bare docker run) => looks up 8.8.8.8 ==='
          defout=$(docker run --rm local/proxy-ip-check:smoke)
          printf '%s\n' "$defout" | head -8
          grep -q 'IP          8.8.8.8' <<< "$defout" \
            || { echo 'FAIL: default CMD did not perform the default lookup'; exit 1; }
          echo 'default CMD OK'

          echo '=== lookup 8.8.8.8 (human) ==='
          docker run --rm local/proxy-ip-check:smoke 8.8.8.8

          echo '=== lookup 8.8.8.8 --json (machine contract) ==='
          docker run --rm local/proxy-ip-check:smoke 8.8.8.8 --json | tee /tmp/out.json
          node -e "
            const fs = require('fs');
            const r = JSON.parse(fs.readFileSync('/tmp/out.json', 'utf8'));
            if (r.ip !== '8.8.8.8') { console.error('BAD: ip field =', r.ip); process.exit(1); }
            console.log('SMOKE OK  ip=' + r.ip + '  asn=' + (r.asn || '-') + '  country=' + (r.country || '-') + (r.error ? '  (lookup error: ' + r.error + ')' : ''));
          "

      # ---------- 3) publish multi-arch ----------
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            socks5ip/proxy-ip-check:latest
            socks5ip/proxy-ip-check:1.0.3
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------- 4) re-verify the PUBLISHED artifact (pull it back and run it) ----------
      - name: Verify published image
        run: |
          set -euo pipefail
          echo '=== docker buildx imagetools inspect ==='
          docker buildx imagetools inspect socks5ip/proxy-ip-check:1.0.3

          echo '=== pull + run the published tag ==='
          docker pull socks5ip/proxy-ip-check:1.0.3
          docker run --rm socks5ip/proxy-ip-check:1.0.3 1.1.1.1 --json | tee /tmp/pub.json
          node -e "
            const fs = require('fs');
            const r = JSON.parse(fs.readFileSync('/tmp/pub.json', 'utf8'));
            if (r.ip !== '1.1.1.1') { console.error('BAD published image'); process.exit(1); }
            console.log('PUBLISHED OK  ip=' + r.ip + '  asn=' + (r.asn || '-') + '  country=' + (r.country || '-'));
          "
